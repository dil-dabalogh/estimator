[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "chore"
version = "0.1.0"
description = "Infrastructure management tool for Estimation Tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0,<0.13.0",
    "rich>=13.0.0,<14.0.0",
    "boto3>=1.34.0",
    "toml>=0.10.2",
    "questionary>=2.0.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "shellingham>=1.5.0",
]

[project.scripts]
chore = "chore.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chore*"]

