AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Estimation Tool API

Globals:
  Function:
    Timeout: 900
    MemorySize: 2048
    Runtime: python3.11

# These Parameters are set during deployment and automatically become Lambda environment variables
# Set them via: sam deploy --guided (interactive)
# Or via: sam deploy --parameter-overrides LLMProvider=bedrock BedrockRegion=us-west-2 ...
# Or via: samconfig.toml configuration file
Parameters:
  VpcId:
    Type: String
    Description: "VPC ID where Diligent VPN is configured"
  
  VpcCidrBlock:
    Type: String
    Description: "VPC CIDR block for additional validation"
  
  ApiGatewaySubnetIds:
    Type: CommaDelimitedList
    Description: "Subnet IDs for API Gateway Interface endpoint (at least 2 in different AZs, comma-separated)"
  
  ApiGatewaySecurityGroupId:
    Type: String
    Description: "Security group ID for API Gateway Interface endpoint"
  
  S3RouteTableIds:
    Type: CommaDelimitedList
    Description: "Route table IDs for S3 Gateway endpoint (comma-separated)"
  
  LLMProvider:
    Type: String
    Default: bedrock
    AllowedValues:
      - openai
      - bedrock
  
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Default: ""
  
  OpenAIModel:
    Type: String
    Default: gpt-4
  
  BedrockRegion:
    Type: String
    Default: us-west-2
    Description: AWS region for Bedrock (optional - defaults to Lambda's region if not specified)
  
  BedrockModel:
    Type: String
    Default: anthropic.claude-3-5-sonnet-20241022-v2:0
  
  BedrockAgentId:
    Type: String
    Default: ""
    Description: "Bedrock Agent ID (optional - if set, will use agent instead of direct model)"
  
  BedrockAgentAliasId:
    Type: String
    Default: ""
    Description: "Bedrock Agent Alias ID (required if BedrockAgentId is set)"
  
  AtlassianURL:
    Type: String
  
  AtlassianEmail:
    Type: String
  
  AtlassianToken:
    Type: String
    NoEcho: true

Resources:
  # API Gateway VPC Interface Endpoint
  ApiGatewayVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.execute-api"
      VpcEndpointType: Interface
      SubnetIds: !Ref ApiGatewaySubnetIds
      SecurityGroupIds:
        - !Ref ApiGatewaySecurityGroupId
      PrivateDnsEnabled: true
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"

  # S3 VPC Gateway Endpoint
  S3VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: !Ref S3RouteTableIds
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action:
              - s3:*
            Resource: "*"

  EstimationApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - "*"

  # Custom resource to set API Gateway resource policy
  ApiGatewayResourcePolicyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: resource_policy_handler.handler
      Runtime: python3.11
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - apigatewayv2:PutResourcePolicy
                - apigatewayv2:GetResourcePolicy
                - apigatewayv2:DeleteResourcePolicy
              Resource: !Sub "arn:aws:apigateway:${AWS::Region}::/apis/${EstimationApi}/*"

  ApiGatewayResourcePolicyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiGatewayResourcePolicyFunction
      Action: lambda:InvokeFunction
      Principal: cloudformation.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"

  ApiGatewayResourcePolicy:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - EstimationApi
      - ApiGatewayVpcEndpoint
      - ApiGatewayResourcePolicyPermission
    Properties:
      ServiceToken: !GetAtt ApiGatewayResourcePolicyFunction.Arn
      ApiId: !Ref EstimationApi
      VpcEndpointId: !Ref ApiGatewayVpcEndpoint
      VpcCidrBlock: !Ref VpcCidrBlock

  EstimationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.11
    Properties:
      CodeUri: ../backend
      Handler: lambda_handler.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
            - Effect: Allow
              Action:
                - bedrock:InvokeAgent
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*"
            - Effect: Allow
              Action:
                - bedrock:InvokeAgent
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/*/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"
      # Parameters (set during deployment) are mapped to Lambda environment variables here
      Environment:
        Variables:
          DEPLOYMENT_VERSION: "2.0"  # Increment to force Lambda update with dependencies
          LLM_PROVIDER: !Ref LLMProvider              # From Parameter: LLMProvider
          OPENAI_API_KEY: !Ref OpenAIApiKey           # From Parameter: OpenAIApiKey
          OPENAI_MODEL: !Ref OpenAIModel              # From Parameter: OpenAIModel
          BEDROCK_REGION: !Ref BedrockRegion          # From Parameter: BedrockRegion (optional - falls back to Lambda's AWS_REGION)
          BEDROCK_MODEL: !Ref BedrockModel            # From Parameter: BedrockModel
          BEDROCK_AGENT_ID: !Ref BedrockAgentId       # From Parameter: BedrockAgentId (optional)
          BEDROCK_AGENT_ALIAS_ID: !Ref BedrockAgentAliasId  # From Parameter: BedrockAgentAliasId (optional)
          ATLASSIAN_URL: !Ref AtlassianURL            # From Parameter: AtlassianURL
          ATLASSIAN_USER_EMAIL: !Ref AtlassianEmail   # From Parameter: AtlassianEmail
          ATLASSIAN_API_TOKEN: !Ref AtlassianToken    # From Parameter: AtlassianToken
          CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
          WEBSOCKET_API_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  
  # Lambda permission for API Gateway to invoke the function
  EstimationFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EstimationFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${EstimationApi}/*/*"
  
  # Integration between API Gateway and Lambda
  EstimationIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref EstimationApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${EstimationFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"
  
  # Create route without authorizer (using resource policy instead)
  EstimationRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
      - EstimationIntegration
      - ApiGatewayVpcEndpoint
    Properties:
      ApiId: !Ref EstimationApi
      RouteKey: "ANY /{proxy+}"
      AuthorizationType: NONE
      Target: !Sub "integrations/${EstimationIntegration}"

  # DynamoDB table for WebSocket connections
  WebSocketConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-websocket-connections"
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: sessionId-index
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  # WebSocket API
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-websocket"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  # Custom resource to set WebSocket API resource policy
  WebSocketApiResourcePolicyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: resource_policy_handler.handler
      Runtime: python3.11
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - apigatewayv2:PutResourcePolicy
                - apigatewayv2:GetResourcePolicy
                - apigatewayv2:DeleteResourcePolicy
              Resource: !Sub "arn:aws:apigateway:${AWS::Region}::/apis/${WebSocketApi}/*"

  WebSocketApiResourcePolicyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketApiResourcePolicyFunction
      Action: lambda:InvokeFunction
      Principal: cloudformation.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"

  WebSocketApiResourcePolicy:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - WebSocketApi
      - ApiGatewayVpcEndpoint
      - WebSocketApiResourcePolicyPermission
    Properties:
      ServiceToken: !GetAtt WebSocketApiResourcePolicyFunction.Arn
      ApiId: !Ref WebSocketApi
      VpcEndpointId: !Ref ApiGatewayVpcEndpoint
      VpcCidrBlock: !Ref VpcCidrBlock

  # WebSocket Connect Handler
  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: websocket_handlers.connect_handler
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnectionsTable

  WebSocketConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketConnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnectFunction.Arn}/invocations"

  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
      - ApiGatewayVpcEndpoint
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketConnectIntegration}"

  # WebSocket Disconnect Handler
  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: websocket_handlers.disconnect_handler
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnectionsTable

  WebSocketDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketDisconnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDisconnectFunction.Arn}/invocations"

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub "integrations/${WebSocketDisconnectIntegration}"

  # WebSocket Default Handler (for messages)
  WebSocketDefaultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: websocket_handlers.default_handler
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketDefaultPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketDefaultFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketDefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDefaultFunction.Arn}/invocations"

  WebSocketDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub "integrations/${WebSocketDefaultIntegration}"

  # WebSocket Deployment and Stage
  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - WebSocketConnectRoute
      - WebSocketDisconnectRoute
      - WebSocketDefaultRoute
    Properties:
      ApiId: !Ref WebSocketApi

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      DeploymentId: !Ref WebSocketDeployment
      StageName: prod

Outputs:
  EstimationApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${EstimationApi}.execute-api.${AWS::Region}.amazonaws.com"
  
  WebSocketApiUrl:
    Description: WebSocket API endpoint URL
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  
  ApiGatewayVpcEndpointId:
    Description: API Gateway VPC Interface Endpoint ID
    Value: !Ref ApiGatewayVpcEndpoint
  
  S3VpcEndpointId:
    Description: S3 VPC Gateway Endpoint ID
    Value: !Ref S3VpcEndpoint

